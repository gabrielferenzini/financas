<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanças do Casal</title>
<meta name="theme-color" content="#F1F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de celular (máx. 480px), cabeçalho com mês, conteúdo em blocos, barra inferior fixa com "+" central; lançamento em folha que sobe de baixo. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface2:#E6EBE5; --ink:#15201A; --muted:#5B6961; --line:#D6DDD5;
  --primary:#15201A; --on-primary:#F1F4F0;
  --g:#2E6BD3; --g-soft:#E1EAFA; --a:#8747CF; --a-soft:#EEE4FA; --c:#BC5A31; --c-soft:#F8E6DC;
  --ok:#1B8548; --ok-soft:#DDF1E4; --warn:#B57A00; --warn-soft:#F8EDCF; --bad:#CF3434; --bad-soft:#FBE1E1;
  --scrim:rgba(10,16,13,.45); --shadow:0 10px 30px rgba(20,32,26,.14);
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#171E1B; --surface2:#212A26; --ink:#E7EDE9; --muted:#94A29A; --line:#2B3530;
  --primary:#E7EDE9; --on-primary:#0E1311;
  --g:#72A2F3; --g-soft:#1B2A45; --a:#B68AF0; --a-soft:#2C2142; --c:#E48B62; --c-soft:#3A2419;
  --ok:#4DC580; --ok-soft:#153323; --warn:#E6B440; --warn-soft:#382C0F; --bad:#F06C6C; --bad-soft:#3D1A1A;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#171E1B; --surface2:#212A26; --ink:#E7EDE9; --muted:#94A29A; --line:#2B3530;
  --primary:#E7EDE9; --on-primary:#0E1311;
  --g:#72A2F3; --g-soft:#1B2A45; --a:#B68AF0; --a-soft:#2C2142; --c:#E48B62; --c-soft:#3A2419;
  --ok:#4DC580; --ok-soft:#153323; --warn:#E6B440; --warn-soft:#382C0F; --bad:#F06C6C; --bad-soft:#3D1A1A;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
html{color-scheme:light}
body{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.login{display:flex;flex-direction:column;gap:14px;padding-top:40px}
.login .err{color:var(--bad);font-weight:600;font-size:14px}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--g);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.me{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px 6px 6px;border-radius:99px;background:var(--surface)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.G{background:var(--g)}.dot.A{background:var(--a)}.dot.C{background:var(--c)}
.mnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:4px}
.mnav button{width:44px;height:40px;border-radius:10px;display:grid;place-items:center}
.mnav button:hover{background:var(--surface2)}
.mnav .ml{font-weight:700;font-family:var(--f-display);font-size:17px;text-transform:capitalize}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.neg{color:var(--bad)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:20px;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v{font-weight:700;white-space:nowrap;text-align:right}
.ic{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none;font-weight:700;color:var(--muted)}
.ic svg{width:20px;height:20px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.G{background:var(--g-soft);color:var(--g)}.tag.A{background:var(--a-soft);color:var(--a)}.tag.C{background:var(--c-soft);color:var(--c)}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.paga{background:var(--ok-soft);color:var(--ok)}.pill.breve{background:var(--warn-soft);color:var(--warn)}.pill.vencida{background:var(--bad-soft);color:var(--bad)}.pill.avencer{background:var(--surface2);color:var(--muted)}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chk svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;background:var(--surface2)}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn svg{width:18px;height:18px}
.acerto{border:2px solid var(--line)}
.acerto .frase{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.2;text-wrap:balance}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.split i{display:block;height:100%}
.split .G{background:var(--g)}.split .A{background:var(--a)}.split .C{background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:13.5px;white-space:nowrap;border:2px solid transparent}
.chip.on{border-color:var(--ink);background:var(--surface)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13.5px}
.bar .track{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--ink)}
.bar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:600;font-size:13.5px}
.sec-h{display:flex;justify-content:space-between;align-items:center}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bottom .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0}
nav.bottom button.on{color:var(--ink)}
nav.bottom button svg{width:22px;height:22px}
nav.bottom .plus{width:58px;height:58px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin:-22px auto 0;box-shadow:var(--shadow)}
nav.bottom .plus svg{width:28px;height:28px}
/* sheet */
#sw{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sw .scrim{position:absolute;inset:0;background:var(--scrim)}
#sheet{position:relative;width:100%;max-width:480px;max-height:94%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh-h h3{margin:0;font-family:var(--f-display);font-size:18px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
.amt{font-family:var(--f-display);font-size:48px;font-weight:700;text-align:center;letter-spacing:-.02em;padding:6px 0}
.amt.zero{color:var(--muted)}
.kp{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;grid-template-rows:repeat(4,58px);gap:8px}
.kp button{background:var(--surface);border-radius:14px;font-size:24px;font-weight:600;font-family:var(--f-display)}
.kp button:active{background:var(--surface2)}
.kp .ok{grid-column:4;grid-row:2/5;background:var(--primary);color:var(--on-primary);font-size:16px;font-family:var(--f-body);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.kp .bk{grid-column:4;grid-row:1}
.kp .bk svg{width:24px;height:24px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{background:var(--surface);border-radius:16px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;min-height:86px}
.cat svg{width:26px;height:26px}
.cat.on{outline:2px solid var(--ink)}
.owners{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.owners.two{grid-template-columns:repeat(2,1fr)}
.own{padding:14px 6px;border-radius:14px;background:var(--surface);font-weight:700;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px}
.own.on.G{border-color:var(--g);background:var(--g-soft);color:var(--g)}
.own.on.A{border-color:var(--a);background:var(--a-soft);color:var(--a)}
.own.on.C{border-color:var(--c);background:var(--c-soft);color:var(--c)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more{display:flex;align-items:center;justify-content:space-between;font-weight:600;color:var(--muted);padding:6px 0}
.hint{font-size:12.5px;color:var(--muted)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--c)}
.savebar{position:sticky;bottom:0;padding-top:8px;background:var(--bg)}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:12px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
/* modal & toast */
#md{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:var(--scrim)}
#md .box{background:var(--surface);border-radius:18px;padding:18px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px}
#md .box p{margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--primary);color:var(--on-primary);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-weight:600;font-size:14px}
#toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
#toast button{color:var(--on-primary);text-decoration:underline;font-weight:700}
.who{display:flex;flex-direction:column;gap:12px;padding-top:30px}
.who .own{padding:22px;font-size:18px}
.evo svg{width:100%;height:auto;display:block}
.evo text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav class="bottom" id="nav"><div class="in">
  <button data-go="inicio"><i data-lucide="house">⌂</i>Início</button>
  <button data-go="mes"><i data-lucide="calendar-days">▦</i>Mês</button>
  <button data-act="novo" aria-label="Lançar gasto"><span class="plus"><i data-lucide="plus">+</i></span></button>
  <button data-go="painel"><i data-lucide="chart-column">▥</i>Painel</button>
  <button data-go="ajustes"><i data-lucide="settings">⚙</i>Ajustes</button>
</div></nav>
<div id="sw" hidden><div class="scrim" data-act="fechar"></div><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="md" hidden></div>
<div id="toast" hidden></div>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</body>
</html>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
</body>
</html>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</body>
</html>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</body>
</html>
<script src="firebase-config.js"></script>
</body>
</html>
<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R2=v=>Math.round((v+Number.EPSILON)*100)/100;
const brl=v=>(v<-0.004?'−':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const keyOf=s=>String(s).slice(0,7);
const idx=k=>{const[y,m]=k.split('-').map(Number);return y*12+m-1;};
const addM=(k,n)=>{const i=idx(k)+n;return Math.floor(i/12)+'-'+pad(i%12+1);};
const mLabel=k=>{const[y,m]=k.split('-').map(Number);return MES[m-1]+' '+y;};
const mShort=k=>{const[y,m]=k.split('-').map(Number);return MES3[m-1]+'/'+String(y).slice(2);};
const dueDate=(k,day)=>{const[y,m]=k.split('-').map(Number);const last=new Date(y,m,0).getDate();return new Date(y,m-1,Math.min(Math.max(1,day||1),last));};
const dStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtD=s=>{if(!s)return'';const[y,m,d]=String(s).split('-');return d+'/'+m+'/'+y;};
const fmtDd=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);
const t0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const daysTo=d=>Math.round((d-t0())/86400000);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const parseBR=s=>{s=String(s||'').trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?R2(v):0;};
const moneyIn=v=>v?Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
const clone=o=>JSON.parse(JSON.stringify(o));
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const sensitive=s=>/\d[\d .-]{11,}\d/.test(String(s||''))&&String(s).replace(/\D/g,'').length>=12;

/* ---------- padrões ---------- */
const GRUPOS=['Moradia','Contas de consumo','Comunicação','Seguros e previdência','Veículo','Saúde','Dora','Serviços domésticos','Educação','Dívidas e financiamentos','Impostos e tarifas','Outros'];
const ICONS=['utensils','party-popper','dog','shirt','heart-pulse','car','house','sparkles','graduation-cap','repeat','smartphone','gift','receipt','briefcase','wrench','ellipsis','shopping-bag','plane','baby','dumbbell','coffee','fuel'];
const cat=(id,n,ic,dono,subs)=>({id,n,ic,dono,subs});
const fixa=(id,n,g,dia,dono,pag)=>({id,n,g,dia,v:0,dono:dono||'C',pag:pag||'G'});
const DEF={
  names:{G:'Gabriel',A:'Ana Luiza'}, pctG:50, inicio:keyOf(todayStr()), cards:[],
  cats:[
    cat('alim','Alimentação','utensils','C',['Supermercado','Restaurante','Delivery','Padaria/café','Açougue/hortifruti','Lanches','Bebidas']),
    cat('lazer','Lazer','party-popper','',['Bares','Cinema/shows','Viagem-passagens','Viagem-hospedagem','Passeios','Hobbies','Jogos']),
    cat('dora','Dora','dog','C',['Ração/petiscos','Banho e tosa','Veterinário','Vacinas/remédios','Acessórios/brinquedos','Creche/hotel pet']),
    cat('roupas','Roupas','shirt','L',['Roupas','Calçados','Acessórios/bolsas','Roupa íntima','Roupa esportiva']),
    cat('saude','Saúde','heart-pulse','',['Farmácia','Consultas','Exames','Dentista','Terapia','Óculos/lentes','Suplementos']),

function firstDue(card,data){const k=keyOf(data),d=Number(String(data).slice(8,10));const closeK=d>=card.fech?addM(k,1):k;return card.venc>card.fech?closeK:addM(closeK,1);}
function parcV(l,i){if(l.n<=1)return l.v;const p=R2(l.v/l.n);return i<l.n-1?p:R2(l.v-p*(l.n-1));}
function pctOfMonth(M){const md=S.meses[M];return md&&md.pctG!=null?md.pctG:S.cfg.pctG;}
function contasDoMes(M){
  const md=S.meses[M]||{},p=pctOfMonth(M),out=[];
  for(const f of S.cfg.fixas){const o=(md.ct||{})[f.id]||{};const v=o.v!=null?o.v:f.v;if(!(v>0))continue;
    out.push({id:f.id,fixa:true,n:f.n,g:f.g,dia:f.dia,v,dono:o.dono||f.dono,pag:o.pag||f.pag,pago:!!o.pago,pctG:p,due:dueDate(M,f.dia),M});}
  for(const[id,a]of Object.entries(md.av||{})){if(!a)continue;out.push({id,fixa:false,n:a.n,g:a.g,dia:a.dia,v:a.v||0,dono:a.dono,pag:a.pag,pago:!!a.pago,pctG:p,due:dueDate(M,a.dia),M});}
  return out.sort((a,b)=>a.dia-b.dia||a.n.localeCompare(b.n));
}
function receitasDoMes(M){
  const md=S.meses[M]||{},p=pctOfMonth(M),out=[];
  for(const f of S.cfg.recFixas){const o=(md.rc||{})[f.id]||{};const v=o.v!=null?o.v:f.v;if(!(v>0))continue;out.push({id:f.id,fixa:true,n:f.n,v,dono:o.dono||f.dono,ok:!!o.ok,dia:f.dia,pctG:p});}
  for(const[id,r]of Object.entries(md.ra||{})){if(!r)continue;out.push({id,fixa:false,n:r.n,v:r.v||0,dono:r.dono,ok:true,data:r.data,pctG:p});}
  return out;
}
function statusOf(c){if(c.pago)return'paga';const d=daysTo(c.due);if(d<0)return'vencida';if(d<=5)return'breve';return'avencer';}
const ST={paga:'✔ Paga',breve:'Vence em breve',vencida:'⚠ Vencida',avencer:'A vencer'};
function sh(it){const v=it.v;if(it.dono==='G')return{G:v,A:0};if(it.dono==='A')return{G:0,A:v};const p=it.pctG!=null?it.pctG:S.cfg.pctG;return{G:v*p/100,A:v*(100-p)/100};}
const vw=(it,P)=>P==='C'?it.v:sh(it)[P];
function calc(M){
  const contas=contasDoMes(M),rec=receitasDoMes(M),parc=[],pix=[],compras=[],mi=idx(M);
  for(const l of S.lanc){
    if(l.tipo==='cartao'&&l.m0){const i=mi-idx(l.m0);if(i>=0&&i<l.n)parc.push({l,i,v:parcV(l,i)});}
    else if(l.tipo==='pix'&&keyOf(l.data)===M)pix.push({l,i:0,v:l.v});
    if(keyOf(l.data)===M)compras.push(l);
  }
  const items=[
    ...contas.map(c=>({k:'conta',v:c.v,dono:c.dono,pctG:c.pctG,pag:c.pag,grp:c.g,src:c})),
    ...parc.map(x=>({k:'parc',v:x.v,dono:x.l.dono,pctG:x.l.pctG,pag:x.l.pag,cat:x.l.cat,src:x})),
    ...pix.map(x=>({k:'pix',v:x.v,dono:x.l.dono,pctG:x.l.pctG,pag:x.l.pag,cat:x.l.cat,src:x}))];
  const parte={G:0,A:0},pago={G:0,A:0},pess={G:0,A:0},casal={G:0,A:0},recP={G:0,A:0};
  for(const it of items){const s=sh(it);parte.G+=s.G;parte.A+=s.A;if(it.pag==='G'||it.pag==='A')pago[it.pag]+=it.v;if(it.dono==='C'){casal.G+=s.G;casal.A+=s.A;}else if(it.dono)pess[it.dono]+=it.v;}
  for(const r of rec){const s=sh(r);recP.G+=s.G;recP.A+=s.A;}
  const sum=a=>a.reduce((t,x)=>t+x.v,0);
  const T={rec:sum(rec),contas:sum(contas),fat:sum(parc),pix:sum(pix)};T.desp=T.contas+T.fat+T.pix;T.saldo=T.rec-T.desp;
  const sG=R2(pago.G-parte.G);
  let frase,from=null,to=null,val=0;
  if(Math.abs(sG)<0.01)frase='Tudo certo: ninguém deve nada neste mês.';
  else if(sG>0){from='A';to='G';val=sG;frase=nm('A')+' transfere '+brl(sG)+' para '+nm('G');}
  else{from='G';to='A';val=-sG;frase=nm('G')+' transfere '+brl(-sG)+' para '+nm('A');}
  return{M,contas,rec,parc,pix,compras,items,parte,pago,pess,casal,recP,T,acerto:{frase,from,to,val}};
}
function persona(C,P){
  if(P==='C')return{rec:C.T.rec,desp:C.T.desp,saldo:C.T.saldo};
  const rec=C.recP[P],pess=C.pess[P],cas=C.casal[P];
  return{rec,pess,cas,desp:pess+cas,pago:C.pago[P],parte:C.parte[P],saldo:rec-pess-cas};
}

function wr(fn){
  if(!db)return Promise.resolve(false);
  let p;try{p=fn();}catch(e){p=Promise.reject(e);}
  return Promise.resolve(p).then(()=>true,e=>{
    const c=e&&e.code;
    if(c==='permission-denied')toast('Sem permissão para salvar. Confira se o seu e-mail está nas regras do Firebase.');
    else if(c==='resource-exhausted')toast('Limite diário do plano gratuito atingido. Tente amanhã.');
    else toast('Não foi possível salvar. Tente de novo.');
    render();return false;});
}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=deepMerge(a[k]&&typeof a[k]==='object'?a[k]:{},b[k]);}else a[k]=b[k];}return a;}
function monthWrite(M,patch){

  unsubM=db.collection('meses').where('k','>=',lo).where('k','<=',hi).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data();});S.meses=m;render();},snapErr);

function boot(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/COLE/.test(cfg.apiKey)){S.dbState='noconfig';render();return;}
  firebase.initializeApp(cfg);
  auth=firebase.auth();db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.onAuthStateChanged(async u=>{
    unsubAll();S.user=u||null;
    if(!u){S.dbState='login';S.lanc=[];S.meses={};render();return;}
    S.dbState='on';S.uid=u.uid;
    unsubC=db.doc('config/main').onSnapshot(s=>{if(s.exists)S.cfg=normCfg(s.data());render();},snapErr);
    if(!S.me){try{const s=await db.doc('ids/'+u.uid).get();if(s.exists&&(s.data().p==='G'||s.data().p==='A')){S.me=s.data().p;ls.set('fc_me',S.me);}}catch(e){}}

function evo(P){

  s+='<text x="0" y="10">máx. '+esc(brl(max))+'</text>';

    s+='<rect x="'+(cx-bw-1)+'" y="'+(top+ph-hr)+'" width="'+bw+'" height="'+hr+'" rx="3" fill="var(--ok)"><title>Receitas '+esc(brl(x.r))+'</title></rect>';

  return s;
}

async function exportMes(){
  const C=calc(S.M),q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',n=v=>R2(v).toFixed(2).replace('.',',');

  for(const r of C.rec){const s=sh(r);rows.push(['Receita',r.data?fmtD(r.data):'',r.n,'','','','',n(r.v),nm(r.dono),r.dono==='C'?r.pctG+'/'+(100-r.pctG):'',n(s.G),n(s.A),'',r.ok?'Recebida':'Prevista']);}
  rows.push([]);rows.push(['Resumo',mLabel(S.M)]);rows.push(['Receitas',n(C.T.rec)]);rows.push(['Despesas',n(C.T.desp)]);rows.push(['Saldo',n(C.T.saldo)]);
  ['G','A'].forEach(p=>rows.push(['Parte '+nm(p),n(C.parte[p]),'Pagou',n(C.pago[p])]));

/* ---------- eventos ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button,[data-act]');if(!t)return;const d=t.dataset;
  if(d.go){S.view=d.go;closeSheet();render();window.scrollTo(0,0);return;}
  if(d.me){setMe(d.me);return;}
  if(d.pv){S.pv=d.pv;render();return;}
  if(d.mt){S.mt=d.mt;render();return;}
  if(d.fd){S.fd=d.fd;render();return;}
  if(d.act==='mprev'||d.act==='mnext'){S.M=addM(S.M,d.act==='mprev'?-1:1);subWindow();render();return;}
  if(d.act==='novo'){if(!S.me){render();return;}openLaunch();return;}
  if(d.act==='fechar'){closeSheet();return;}
  if(d.act==='novaconta'){editConta(S.M,null,false);return;}
  if(d.act==='novarec'){editRec(S.M,null,false);return;}
  if(d.act==='export'){exportMes();return;}
  if(d.act==='login'){doLogin();return;}
  if(d.act==='reset'){doReset();return;}
  if(d.act==='logout'){if(await confirmBox('Sair desta conta neste aparelho?','Sair')){S.me=null;ls.set('fc_me','');closeSheet();auth.signOut();}return;}
  if(d.act==='acerto1'||d.act==='acerto0'){const C=calc(S.M);
    if(d.act==='acerto1')monthWrite(S.M,{acerto:{feito:true,por:S.me,em:todayStr(),valor:C.acerto.val,de:C.acerto.from,para:C.acerto.to}});
    else if(await confirmBox('Desmarcar o acerto de '+mShort(S.M)+' como feito?','Desmarcar'))monthWrite(S.M,{acerto:{feito:false}});return;}
  if(d.pagar){const[M,id,fx]=d.pagar.split('|');const md=S.meses[M]||{};
    if(fx==='1'){const cur=!!(((md.ct||{})[id])||{}).pago;monthWrite(M,{ct:{[id]:{pago:!cur}}});}
    else{const cur=!!(((md.av||{})[id])||{}).pago;monthWrite(M,{av:{[id]:{pago:!cur}}});}return;}
  if(d.conta){const[M,id,fx]=d.conta.split('|');editConta(M,id,fx==='1');return;}
  if(d.rec){const[id,fx]=d.rec.split('|');editRec(S.M,id,fx==='1');return;}
  if(d.lanc){const l=S.lanc.find(x=>x.id===d.lanc);if(l)openLaunch(l);return;}
  if(d.ed){const[k,id]=d.ed.split('|');editCfg(k,id||null);return;}
  /* lançamento */
  if(L){
    if(d.k){const k=d.k;
      if(k==='ok'){if(!(lv()>0)){toast('Digite o valor.');return;}L.step=L.cat?3:2;drawL();return;}
      if(k==='bk')L.cents=L.cents.slice(0,-1);else if((L.cents+k).replace(/^0+/,'').length<=9)L.cents=(L.cents+k).replace(/^0+/,'');
      drawL();return;}
    if(d.fav){const f=S.cfg.favs.find(x=>x.id===d.fav);if(!f)return;L.fav=f.id;L.cat=f.cat;L.sub=f.sub||'';L.dono=f.dono==='L'?S.me:f.dono;L.donoT=true;if(lv()>0)L.step=3;drawL();return;}
    if(d.cat){setCat(d.cat);L.step=3;drawL();return;}
    if(d.sub!=null&&t.classList.contains('chip')){L.sub=L.sub===d.sub?'':d.sub;readL();drawL();return;}
    if(d.o==='dono'){readL();L.dono=d.v;L.donoT=true;drawL();return;}
    if(d.o==='pag'){readL();L.pag=d.v;drawL();return;}
    if(d.pay){readL();L.pay=d.pay;if(d.pay!=='pix')L.pag=cardOf(d.pay).tit;else L.pag=S.me;drawL();return;}
    if(d.pct){readL();if(d.pct==='def'){L.custom=false;L.pct=S.cfg.pctG;}else{L.custom=true;L.pct=parseInt(d.pct,10);}drawL();return;}
    if(d.l==='close'){closeSheet();return;}
    if(d.l==='s1'){readL();L.step=1;drawL();return;}
    if(d.l==='s2'){readL();L.step=2;drawL();return;}
    if(d.l==='more'){readL();L.more=!L.more;drawL();return;}
    if(d.l==='save'){saveL();return;}
    if(d.l==='del'){const e=L.edit;if(await confirmBox('Excluir este lançamento de '+brl(e.v)+(e.n>1?' (todas as '+e.n+' parcelas)':'')+'?','Excluir',true)){closeSheet();delLanc(e.id);toast('Lançamento excluído.');}return;}
  }
  /* formulários */
  if(F&&!$('#sw').hidden){
    if(d.o){F.vals=readF();F.vals[d.o]=d.v;t.parentElement.querySelectorAll('.own').forEach(b=>b.classList.toggle('on',b===t));return;}
    if(d.tg){F.vals=readF();F.vals[d.tg]=!F.vals[d.tg];t.querySelector('.sw').classList.toggle('on',!!F.vals[d.tg]);return;}
    if(d.f==='close'){F=null;closeSheet();return;}
    if(d.f==='save'){const x=readF();if(await F.onSave(x)!==false){F=null;closeSheet();}return;}
    if(d.f==='del'){if(await F.onDel()){F=null;closeSheet();}return;}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='l-pct'&&L){L.custom=true;L.pct=parseInt(t.value,10);$('#pg').textContent=L.pct;$('#pa').textContent=100-L.pct;document.querySelectorAll('[data-pct]').forEach(b=>b.classList.toggle('on',b.dataset.pct===String(L.pct)));}
  if(t.id==='f-pctG'){$('#rv').textContent=t.value+'% / '+(100-t.value)+'%';}
  if((t.id==='l-n'||t.id==='l-data')&&L){readL();const card=L.pay==='pix'?null:cardOf(L.pay);const hEl=document.querySelector('#sheet .hint');if(card&&hEl)hEl.textContent='Pago por '+nm(card.tit)+' (titular). '+parcInfo(card);}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&(ev.target.id==='lg-pw'||ev.target.id==='lg-email')){doLogin();return;}
  if(!L||L.step!==1||$('#sw').hidden)return;
  if(/^[0-9]$/.test(ev.key)){if((L.cents+ev.key).replace(/^0+/,'').length<=9)L.cents=(L.cents+ev.key).replace(/^0+/,'');drawL();ev.preventDefault();}
  else if(ev.key==='Backspace'){L.cents=L.cents.slice(0,-1);drawL();ev.preventDefault();}
  else if(ev.key==='Enter'){if(lv()>0){L.step=L.cat?3:2;drawL();}ev.preventDefault();}
  else if(ev.key==='Escape')closeSheet();
});

window.addEventListener('online',render);window.addEventListener('offline',render);
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
render();boot();
})();
</script>
</body>
</html>
